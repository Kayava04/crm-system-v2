volumes:
  postgres-data:
  seq-data:
  uploads:
  logs:

services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
    restart: unless-stopped
    container_name: crm-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "sh -c 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB'"]
      interval: 120s
      timeout: 5s
      retries: 2
      start_period: 30s

  seq:
    image: datalust/seq
    container_name: crm-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD}
    ports:
      - "5341:5341"
      - "8081:80"
    volumes:
      - seq-data:/data

  # The API itself. Not started by a plain "docker compose up" (only Postgres and Seq are);
  # start it with:  docker compose --profile app up -d --build
  # Needs in .env: JWT_SECRET_KEY (32+ characters), SUPERADMIN_EMAIL, SUPERADMIN_PASSWORD
  api:
    profiles: ["app"]
    build: ./backend
    container_name: crm-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      seq:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      SuperAdmin__Email: ${SUPERADMIN_EMAIL}
      SuperAdmin__Password: ${SUPERADMIN_PASSWORD}
      Database__MigrateOnStartup: "true"
      Storage__Path: /app/uploads
      # Normal browser traffic goes through nginx's /api proxy (same origin, no CORS
      # involved); this only matters for something calling the API directly from a
      # different origin, e.g. `npm run dev` without the Vite proxy.
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:-http://localhost:5173}
      # "localhost" from appsettings.json means the api container itself, not the seq container;
      # inside the compose network Seq is reachable by its service name instead. Index 2 is the
      # Seq entry in appsettings.json's Serilog:WriteTo array (Console, File, Seq) — keep them in sync.
      Serilog__WriteTo__2__Args__serverUrl: http://seq:5341
    volumes:
      - uploads:/app/uploads
      - logs:/app/Logs
    ports:
      - "8080:8080"

  # The SPA, built and served by nginx, which also reverse-proxies /api to the
  # `api` service over the compose network (see frontend/nginx.conf). Same profile
  # as the API, so `docker compose --profile app up -d --build` brings up the whole
  # app. No VITE_API_URL to set: works the same from localhost, a phone on the LAN,
  # or a real domain, with no rebuild per environment.
  web:
    profiles: ["app"]
    build:
      context: ./frontend
    container_name: crm-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"
