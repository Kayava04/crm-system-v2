volumes:
  postgres-data:
  seq-data:
  uploads:
  logs:

services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
    restart: unless-stopped
    container_name: crm-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "sh -c 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB'"]
      interval: 120s
      timeout: 5s
      retries: 2
      start_period: 30s

  seq:
    image: datalust/seq
    container_name: crm-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD}
    ports:
      - "5341:5341"
      - "8081:80"
    volumes:
      - seq-data:/data

  api:
    profiles: ["app"]
    build: ./backend
    container_name: crm-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      seq:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      SuperAdmin__Email: ${SUPERADMIN_EMAIL}
      SuperAdmin__Password: ${SUPERADMIN_PASSWORD}
      Database__MigrateOnStartup: "true"
      Storage__Path: /app/uploads
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:-http://localhost:5173}
      Serilog__WriteTo__2__Args__serverUrl: http://seq:5341
    volumes:
      - uploads:/app/uploads
      - logs:/app/Logs
    ports:
      - "8080:8080"

  web:
    profiles: ["app"]
    build:
      context: ./frontend
    container_name: crm-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"
