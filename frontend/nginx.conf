# Serves the built SPA. All non-file routes fall back to index.html so React
# Router's client-side routes (e.g. /students/123) work on a hard refresh or a
# direct link, not just on in-app navigation.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed build assets (index-<hash>.js/css) are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
