# Serves the built SPA and reverse-proxies /api to the backend container, so the
# browser only ever talks to this one origin — whatever host/IP/port it used to
# reach this server also serves the API, with nothing baked in at build time.
# All non-file, non-API routes fall back to index.html so React Router's
# client-side routes (e.g. /students/123) work on a hard refresh or a direct link,
# not just on in-app navigation.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Matches the backend's own import/photo upload limit (see README).
    client_max_body_size 5m;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets (index-<hash>.js/css) are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html references the current hashed asset filenames, so a phone or
    # browser caching it (there was no Cache-Control before, only heuristics)
    # could keep loading an old build after a new one is deployed.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
